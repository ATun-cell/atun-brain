version: '3.9'

services:
  mysql:
    image: mysql:8.0.32
    container_name: atun-brain-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-atun-brain}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
    ports:
      - "13307:3306"
    volumes:
      - ./mysql/sql:/docker-entrypoint-initdb.d
    networks:
      - atun-brain-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atun-brain-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - /qdrant-data:/qdrant/storage
    networks:
      - atun-brain-network


networks:
  atun-brain-network:
    driver: bridge