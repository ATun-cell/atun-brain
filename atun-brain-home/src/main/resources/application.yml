spring:
  application:
    name: atun-brain-ai
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:atun_brain}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.secondbrain.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    lazy-loading-enabled: false

server:
  port: ${SERVER_PORT:8089}
  servlet:
    context-path: /api

# Qdrant配置（已迁移到 agent.rag.qdrant）
# qdrant:
#   host: ${QDRANT_HOST:localhost}
#   port: ${QDRANT_PORT:6334}
#   use-tls: false
#   collection-name: ${QDRANT_COLLECTION:transactions}
#   vector-size: 1536

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.atun.brain: DEBUG
    com.atun.brain.infrastructure.persistence.mybatis.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Agent 统一配置（替代旧的 ai.* 和 qdrant.* 配置）
agent:
  # 服务提供商选择：dashscope(阿里云百炼) | openai
  provider: ${AI_PROVIDER:dashscope}

  # ===== 内置 AI 服务系统提示词模板 =====

  # 对话场景系统提示词（DIRECT_LLM 场景）- 用于日常对话、闲聊
  conversation-system-prompt: |
    你是一个专业、友好、乐于助人的 AI 助手。

    请遵循以下原则：
    1. 用简洁清晰的语言回答问题
    2. 保持礼貌和专业的语气
    3. 如果不确定答案，请诚实告知用户
    4. 避免提供可能有害的建议
    5. 尊重用户的隐私
    6. 对于涉及专业领域的问题（医疗、法律等），建议用户咨询专业人士

  # 工具调用场景系统提示词（AUTO_TOOL_CHAIN 场景）- 用于需要调用工具的复杂任务
  tool-call-system-prompt: |
    你是一个智能助手，可以调用工具来帮助用户完成任务。

    请遵循以下原则：
    1. 分析用户需求，判断是否需要调用工具
    2. 如果需要调用工具，选择合适的工具并提供正确的参数
    3. 工具执行后，根据执行结果组织自然语言回复
    4. 如果工具调用失败，向用户说明原因并提供替代方案
    5. 对于复杂任务，可以按顺序调用多个工具
    6. 不要假设工具执行成功，始终基于实际结果回复用户

  # ===== AI 模型配置 =====

  # 阿里云百炼配置（兼容 OpenAI 接口）
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:sk-your-dashscope-api-key}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    models:
      default: qwen-turbo
      chat: qwen-turbo          # 对话模型（快速响应）
      analysis: qwen-plus       # 分析模型（平衡性能）
      report: qwen-max          # 报告生成（高质量）
      parsing: qwen-plus        # 交易解析（结构化输出）
      embedding: text-embedding-v2  # 向量化模型
    temperature: 0.7
    max-tokens: 2000
    timeout: 30

  # OpenAI配置（备用）
  openai:
    api-key: ${OPENAI_API_KEY:sk-your-openai-api-key}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    models:
      default: gpt-4o-mini
      chat: gpt-4o-mini
      analysis: gpt-4o
      report: gpt-4o
      parsing: gpt-4o
      embedding: text-embedding-3-small
    temperature: 0.7
    max-tokens: 2000
    timeout: 60

  # 重试配置
  retry:
    max-attempts: 3
    backoff-ms: 1000

  # RAG 配置
  rag:
    enabled: true
    store: qdrant
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
      collection: ${QDRANT_COLLECTION:atun-brain}
    embedding:
      dimension: ${EMBEDDING_DIMENSION:1536}

  # 记忆配置
  memory:
    enabled: true
    store: jdbc               # jdbc | redis | in-memory
    window:
      strategy: MESSAGE       # MESSAGE | TOKEN
      max-messages: 100
      max-tokens: 2000

  # 工具配置
  tools:
    enabled: true
    enabled-groups: []         # 空=全部启用