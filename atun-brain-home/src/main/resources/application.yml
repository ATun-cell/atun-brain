spring:
  application:
    name: atun-brain-ai
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:atun_brain}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.secondbrain.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    lazy-loading-enabled: false

server:
  port: ${SERVER_PORT:8089}
  servlet:
    context-path: /api

# Qdrant配置（已迁移到 agent.rag.qdrant）
# qdrant:
#   host: ${QDRANT_HOST:localhost}
#   port: ${QDRANT_PORT:6334}
#   use-tls: false
#   collection-name: ${QDRANT_COLLECTION:transactions}
#   vector-size: 1536

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.atun.brain: DEBUG
    com.atun.brain.infrastructure.persistence.mybatis.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Agent 统一配置（替代旧的 ai.* 和 qdrant.* 配置）
agent:
  # 服务提供商选择：dashscope(阿里云百炼) | openai
  provider: ${AI_PROVIDER:dashscope}

  # 阿里云百炼配置（兼容 OpenAI 接口）
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:sk-your-dashscope-api-key}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    models:
      default: qwen-turbo
      chat: qwen-turbo          # 对话模型（快速响应）
      analysis: qwen-plus       # 分析模型（平衡性能）
      report: qwen-max          # 报告生成（高质量）
      parsing: qwen-plus        # 交易解析（结构化输出）
      embedding: text-embedding-v2  # 向量化模型
    temperature: 0.7
    max-tokens: 2000
    timeout: 30

  # OpenAI配置（备用）
  openai:
    api-key: ${OPENAI_API_KEY:sk-your-openai-api-key}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    models:
      default: gpt-4o-mini
      chat: gpt-4o-mini
      analysis: gpt-4o
      report: gpt-4o
      parsing: gpt-4o
      embedding: text-embedding-3-small
    temperature: 0.7
    max-tokens: 2000
    timeout: 60

  # 重试配置
  retry:
    max-attempts: 3
    backoff-ms: 1000

  # RAG 配置
  rag:
    enabled: true
    store: qdrant
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
      collection: ${QDRANT_COLLECTION:atun-brain}
    embedding:
      dimension: ${EMBEDDING_DIMENSION:1536}

  # 记忆配置
  memory:
    enabled: true
    store: jdbc               # jdbc | redis | in-memory
    window:
      strategy: MESSAGE       # MESSAGE | TOKEN
      max-messages: 100
      max-tokens: 2000

  # 工具配置
  tools:
    enabled: true
    enabled-groups: []         # 空=全部启用