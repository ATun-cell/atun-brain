# 开发环境配置
# 启动方式: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# 或在 application.yml 中设置 spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:mysql://101.35.119.204:13307/atun-brain?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456

server:
  port: 8089

# Agent 配置（开发环境）
agent:
  provider: dashscope
  
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:sk-your-dashscope-api-key}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    models:
      default: qwen-plus
      chat: qwen-turbo
      analysis: qwen-plus
      report: qwen-max
      parsing: qwen-plus
      embedding: text-embedding-v2
    temperature: 0.7
    max-tokens: 2000
    timeout: 30

  openai:
    api-key: ${OPENAI_API_KEY:sk-your-openai-api-key}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

  memory:
    enabled: true
    store: jdbc

  rag:
    enabled: true
    store: qdrant
    qdrant:
      host: 101.35.119.204
      port: 6334
      collection-name: agent_knowledge

# 日志配置
logging:
  level:
    com.atun.brain: DEBUG
    com.atun.brain.infrastructure.persistence.mybatis.mapper: DEBUG